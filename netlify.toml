"$schema" = "https://open-api.netlify.com/netlify.schema.json"

# Deployment is owned by Netlify's Git integration: a push to the production
# branch runs `bun run build` (not `bun run generate`) and publishes
# `.output/public`. `ssr: false` in nuxt.config.ts keeps pages client-rendered.
[build]
  command = "bun run build"
  publish = ".output/public"

[build.environment]
  # This repo uses `bun.lock` (not `bun.lockb`). Pin the version so Netlify's
  # detection cannot drift.
  BUN_VERSION = "1.3.14"

# Additional (non-Nitro) functions live here, e.g. the scheduled cleanup job.
# Nitro's own functions are emitted to .netlify/functions-internal by the
# netlify preset.
[functions]
  directory = "netlify/functions"

# `netlify dev` is the local path for API/Blobs work; `nuxt dev` has no Netlify
# runtime context.
[dev]
  command = "bun run dev"
  targetPort = 3000
  framework = "#custom"
