"$schema" = "https://open-api.netlify.com/netlify.schema.json"

# Deployment is owned by Netlify's Git integration: a push to the production
# branch runs `bun run build` (not `bun run generate`) and publishes `dist`.
# The Nitro netlify preset emits client assets to `dist/` and the API function
# to `.netlify/functions-internal`; `ssr: false` keeps pages client-rendered.
[build]
  command = "bun run build"
  publish = "dist"

[build.environment]
  # This repo uses `bun.lock` (not `bun.lockb`). Pin the version so Netlify's
  # detection cannot drift.
  BUN_VERSION = "1.3.14"

# Additional (non-Nitro) functions live here, e.g. the scheduled cleanup job.
# Nitro's own functions are emitted to .netlify/functions-internal by the
# netlify preset.
[functions]
  directory = "netlify/functions"

# Code-based rate limiting. Netlify supports this for redirects on every plan
# (2 rules max on Free), but not for Nitro-generated functions in netlify.toml.
# The OCR rule is listed first so it always wins for that path; the broad rule
# covers every other API route. Both count per IP + domain and block with 429.
[[redirects]]
  from = "/api/ocr"
  to = "/api/ocr"
  status = 200
  force = true
  [redirects.rate_limit]
    window_limit = 5
    window_size = 60
    aggregate_by = ["ip", "domain"]

[[redirects]]
  from = "/api/*"
  to = "/api/:splat"
  status = 200
  force = true
  [redirects.rate_limit]
    window_limit = 120
    window_size = 60
    aggregate_by = ["ip", "domain"]

# `netlify dev` is the local path for API/Blobs work; `nuxt dev` has no Netlify
# runtime context.
[dev]
  command = "bun run dev"
  targetPort = 3000
  framework = "#custom"
